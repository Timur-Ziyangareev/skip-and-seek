<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px 16px 16px;
      color: #111;
      background: #fff;
    }
    h1 { font-size: 15px; margin: 0 0 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 11px 0; }
    .hint { font-size: 12px; color: #666; margin-top: 14px; line-height: 1.5; }
    kbd {
      background: #eee; border: 1px solid #ccc; border-bottom-width: 2px;
      border-radius: 4px; padding: 0 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    }
    hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    .section { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .03em; margin: 4px 0 2px; }
    input[type=number] { width: 60px; padding: 4px 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; transition: .2s; cursor: pointer; }
    .slider:before {
      content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #2563eb; }
    input:checked + .slider:before { transform: translateX(18px); }
    .big-hint {
      font-size: 15px; font-weight: 700; color: #b91c1c;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
      padding: 10px 12px; margin: 10px 0; line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>🎬 Скипатель рекламы (и видео)</h1>

  <div class="big-hint">Если реклама не автоскипается — скипайте вручную на <kbd>D</kbd></div>

  <div class="row">
    <span>Включено</span>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <span>Шаг перемотки (сек)</span>
    <input type="number" id="seekSeconds" min="1" max="600" step="1" value="5">
  </div>

  <hr>
  <div class="section">Реклама</div>

  <div class="row">
    <span>Автопропуск рекламы</span>
    <label class="switch">
      <input type="checkbox" id="adEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="hint">
    <kbd>A</kbd> — назад · <kbd>D</kbd> — вперёд<br>
    Работает на любом сайте с видео.
  </div>
  <script src="popup.js"></script>
</body>
</html>
